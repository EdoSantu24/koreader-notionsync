name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  # Without this, branch-per-change pull requests get no checks at all.
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint Lua Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The plugin runs on LuaJIT (Lua 5.1 semantics) on the device. Linting under
      # Lua 5.4 would accept syntax and stdlib calls that fail on the e-reader.
      # v13 or newer is required: v10 installed LuaJIT by downloading
      # https://luajit.org/download/LuaJIT-<version>.tar.gz, and no
      # LuaJIT-2.1.tar.gz exists there, so "luajit-2.1" 404s. From v13 the
      # action clones the v2.1 branch of the official LuaJIT repo instead.
      - name: Setup LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck notionsync.koplugin/ spec/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # v13 or newer is required: v10 installed LuaJIT by downloading
      # https://luajit.org/download/LuaJIT-<version>.tar.gz, and no
      # LuaJIT-2.1.tar.gz exists there, so "luajit-2.1" 404s. From v13 the
      # action clones the v2.1 branch of the official LuaJIT repo instead.
      - name: Setup LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      # The suite is dependency-free by design so it runs identically here and on
      # a developer machine with nothing but a LuaJIT binary. The interpreter is
      # exposed as `lua` by the setup action, but fall back to `luajit` so this
      # does not break if that changes.
      - name: Run test suite
        run: |
          if command -v lua >/dev/null 2>&1; then
            lua spec/run.lua
          else
            luajit spec/run.lua
          fi

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from tag or use commit SHA
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "IS_TAG=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "IS_TAG=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare artifact directory
        run: |
          mkdir -p artifact-staging
          cp -r notionsync.koplugin artifact-staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: notionsync.koplugin-${{ steps.get_version.outputs.VERSION }}
          path: artifact-staging/
          retention-days: 30

      - name: Create plugin archive for release
        if: steps.get_version.outputs.IS_TAG == 'true'
        run: |
          tar -czf notionsync.koplugin-${{ steps.get_version.outputs.VERSION }}.tar.gz \
            -C . notionsync.koplugin/

      - name: Generate changelog
        if: steps.get_version.outputs.IS_TAG == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing, so the release would have no notes."
            exit 1
          fi

          # awk rather than `sed -n '/start/,/end/p' | sed '$d'`: that form deletes
          # the last line of the range, which silently ate a real content line
          # whenever the section ran to end-of-file with no following heading.
          BODY=$(awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found                { print }
          ' CHANGELOG.md)

          # A heading that does not match the tag produced an EMPTY release body
          # and published anyway. Failing here is loud and recoverable: fix the
          # changelog, delete the tag, push it again.
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error::No changelog entries found under '## [$VERSION]'."
            echo "::error::The heading must match the tag version exactly."
            echo "Headings present in CHANGELOG.md:"
            grep -n '^## \[' CHANGELOG.md || true
            exit 1
          fi

          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.get_version.outputs.IS_TAG == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: notionsync.koplugin-${{ steps.get_version.outputs.VERSION }}.tar.gz
          body: |
            # NotionSync KOReader Plugin ${{ steps.get_version.outputs.VERSION }}

            ## Installation

            1. Download `notionsync.koplugin-${{ steps.get_version.outputs.VERSION }}.tar.gz`
            2. Extract into your KOReader plugins directory. The path depends on
               your device, and `.adds` is Kobo-only:

               ```bash
               # Kindle (Colorsoft, Scribe, Paperwhite, ...)
               tar -xzf notionsync.koplugin-${{ steps.get_version.outputs.VERSION }}.tar.gz -C /path/to/device/koreader/plugins/

               # Kobo
               tar -xzf notionsync.koplugin-${{ steps.get_version.outputs.VERSION }}.tar.gz -C /path/to/device/.adds/koreader/plugins/
               ```

               Newer Kindles connect over MTP and have no drive letter, so extract
               locally first and copy the `notionsync.koplugin` folder across in
               your file manager.
            3. Eject your device and fully restart KOReader (plugins load only at startup)

            Alternatively, download the artifact zip from this workflow run and extract the `notionsync.koplugin` folder directly to your plugins directory.

            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
